<!DOCTYPE html>
<html lang="ko"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>호흡의 원리</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&amp;family=Noto+Sans+KR:wght@500;700;900&amp;display=swap" rel="stylesheet">
  <style>
html,body{margin:0;height:100%;background:#FFF9F0;overflow:hidden}
canvas{display:block;position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;cursor:pointer}
#hint{position:fixed;right:8px;bottom:6px;font:12px "Noto Sans KR",sans-serif;color:#9a8f86}
</style>
  <script src="https://cdn.tailwindcss.com/3.4.17" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js" type="text/javascript"></script>
  
  
  
 </head>
 <body data-template-id="__page-root">
  <canvas id="cv"></canvas>
  <div id="hint" data-template-id="pause-hint" class="canva-text">
   화면을 누르면 멈춤/재생
  </div>
  <script>
const C={cream:'#FFF9F0',coral:'#E3614A',coralL:'#F8D3CA',teal:'#2BBFAE',tealD:'#1E8C80',ink:'#1D1F26',navy:'#35415A',gray:'#8C8C96',blue:'#3D7FD9',yellow:'#FFC94A',paper:'#FFFFFF'};
const HF='"Do Hyeon","Noto Sans KR",sans-serif', BF='"Noto Sans KR",sans-serif';
const cv=document.getElementById('cv'),c=cv.getContext('2d');let VW=800,VH=600,sc=1,ox=0,oy=0;
function fit(){cv.width=VW*2;cv.height=VH*2;sc=2;ox=0;oy=0}
fit();
let paused=false;cv.onclick=()=>{paused=!paused};
function T(s,x,y,o={}){c.font=(o.w||700)+' '+(o.s||24)+'px '+(o.f||BF);c.fillStyle=o.c||C.ink;c.textAlign=o.a||'left';c.textBaseline=o.b||'alphabetic';c.fillText(s,x,y)}
function H(s,x,y,o={}){T(s,x,y,Object.assign({f:HF,w:400},o))}
function rr(x,y,w,h,r,fill,stroke,lw){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||2;c.stroke()}}
function dot(x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,7);c.fill()}
function arrow(x1,y1,x2,y2,col,lw){c.strokeStyle=col;c.fillStyle=col;c.lineWidth=lw||4;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();const a=Math.atan2(y2-y1,x2-x1),L=lw*3.2+6;c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-L*Math.cos(a-0.45),y2-L*Math.sin(a-0.45));c.lineTo(x2-L*Math.cos(a+0.45),y2-L*Math.sin(a+0.45));c.fill()}
function flame(x,y,s,t){for(let k=0;k<3;k++){c.fillStyle=k?'#FFB13B':C.coral;const hh=s*(1.6-k*0.35)*(0.85+0.15*Math.sin(t*12+x+k));c.beginPath();c.moveTo(x-s*0.55*(1-k*0.25),y);c.quadraticCurveTo(x-s*0.5,y-hh*0.6,x,y-hh);c.quadraticCurveTo(x+s*0.5,y-hh*0.6,x+s*0.55*(1-k*0.25),y);c.fill()}}
function thermo(x,y,h,frac,label){rr(x-9,y,18,h,9,'#fff','#bdb6ae',2);dot(x,y+h+8,14,C.coral);c.fillStyle=C.coral;c.fillRect(x-4,y+h-(h-6)*Math.max(0,Math.min(1,frac)),8,(h-6)*Math.max(0,Math.min(1,frac))+8);if(label)T(label,x,y-10,{a:'center',s:20,c:C.ink})}
function speedCol(s){s=Math.max(0,Math.min(1,s));const a=[61,127,217],b=[227,97,74];return `rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*s)).join(',')})`}
let last=performance.now(),t=0;
function frame(now){const dt=Math.max(0,Math.min(0.05,(now-last)/1000));last=now;if(!paused)t+=dt;
 c.setTransform(1,0,0,1,0,0);c.fillStyle=C.cream;c.fillRect(0,0,cv.width,cv.height);c.setTransform(sc,0,0,sc,ox,oy);
 draw(paused?0:dt,t);if(paused){rr(VW-120,14,106,34,17,'rgba(29,31,38,.7)');T('⏸ 멈춤',VW-67,38,{a:'center',s:18,c:'#fff'})}
 requestAnimationFrame(frame)}
VW=960;VH=540;fit();
const AIR=[];for(let i=0;i<14;i++)AIR.push(Math.random());
const LP=[];for(let i=0;i<36;i++){const r=Math.sqrt(Math.random())*0.8,a=Math.random()*6.283;LP.push({s:i%2?1:-1,x:Math.cos(a)*r,y:Math.sin(a)*r,ph:Math.random()*6.283})}
const PER=7;
function draw(dt,t){
  const u=(t%PER)/PER, vol=(1-Math.cos(2*Math.PI*u))/2, flow=Math.sin(2*Math.PI*u); // vol 0..1, flow>0 들숨
  const inh=flow>0, strong=Math.abs(flow)>0.15;
  H('호흡의 원리 — 들숨과 날숨',480,46,{a:'center',s:34});
  // ---------- left: chest
  rr(24,72,500,446,18,'#fff');
  const cx=274, ty=96, cy=290;
  // ribcage
  c.strokeStyle='#d9cfc4';c.lineWidth=7;
  for(let k=0;k<5;k++){const y=178+k*42-vol*8, wR=150+k*8+vol*16;c.beginPath();c.moveTo(cx-6,y-14);c.quadraticCurveTo(cx-wR,y-6+vol*4,cx-wR+18,y+30);c.moveTo(cx+6,y-14);c.quadraticCurveTo(cx+wR,y-6+vol*4,cx+wR-18,y+30);c.stroke()}
  // lungs
  const lw=78+vol*22, lh=118+vol*22, lcy=cy+vol*8;
  [-1,1].forEach(s=>{c.fillStyle='#f6a99b';c.beginPath();c.ellipse(cx+s*(lw*0.7+14),lcy,lw*0.62,lh,s*0.08,0,7);c.fill();c.strokeStyle='#e08a7a';c.lineWidth=3;c.stroke()});
  LP.forEach(p=>{p.ph+=dt*3;const ex=cx+p.s*(lw*0.7+14)+p.x*lw*0.55+Math.sin(p.ph)*2, ey=lcy+p.y*lh*0.85+Math.cos(p.ph*1.3)*2;dot(ex,ey,3.5,'rgba(61,127,217,.5)')});
  // trachea & bronchi
  c.strokeStyle='#c96b5c';c.lineWidth=14;c.lineCap='round';c.beginPath();c.moveTo(cx,ty);c.lineTo(cx,lcy-lh+30);c.stroke();
  c.lineWidth=9;c.beginPath();c.moveTo(cx,lcy-lh+30);c.lineTo(cx-lw*0.6,lcy-lh+70);c.moveTo(cx,lcy-lh+30);c.lineTo(cx+lw*0.6,lcy-lh+70);c.stroke();c.lineCap='butt';
  // air particles in trachea
  AIR.forEach((q,i)=>{AIR[i]=((q+flow*dt*0.9)%1+1)%1;const y=ty-14+AIR[i]*(lcy-lh+30-ty+14);if(Math.abs(flow)>0.05)dot(cx+Math.sin(i*2.1)*3,y,4.5,C.blue)});
  // big flow arrow beside trachea
  if(strong){const col=inh?C.teal:C.coral; if(inh)arrow(cx+46,92,cx+46,150,col,5);else arrow(cx+46,150,cx+46,92,col,5);
    T(inh?'공기 들어옴':'공기 나감',cx+60,126,{s:17,c:col,w:900})}
  // diaphragm
  const dTop=lcy+lh-6+vol*26, dome=46-vol*30;
  c.strokeStyle=C.navy;c.lineWidth=9;c.beginPath();c.moveTo(cx-205,dTop+20);c.quadraticCurveTo(cx,dTop-dome,cx+205,dTop+20);c.stroke();
  T('가로막',cx+150,dTop+46,{s:17,c:C.navy,w:900});
  if(strong){const dc=inh?C.teal:C.coral;if(inh)arrow(cx-150,dTop-6,cx-150,dTop+30,dc,4);else arrow(cx-150,dTop+30,cx-150,dTop-6,dc,4)}
  // ---------- right: steps + pressure
  const px=548;
  rr(px,72,388,62,14,inh?C.teal:C.coral); H(inh?'들숨':'날숨',px+194,114,{a:'center',s:32,c:'#fff'});
  const steps=inh?['가로막 ↓ · 갈비뼈 ↑','폐의 부피 ↑','폐 속 압력 ↓ (대기압보다 낮음)','공기가 밖 → 폐로 들어옴']
                 :['가로막 ↑ · 갈비뼈 ↓','폐의 부피 ↓','폐 속 압력 ↑ (대기압보다 높음)','공기가 폐 → 밖으로 나감'];
  const lit=Math.min(4,Math.floor((inh?u:u-0.5)*2*4.6)+1);
  steps.forEach((s,i)=>{const y=148+i*52,on=i<lit;rr(px,y,388,44,10,on?(inh?'#d5f2ee':C.coralL):'#f3eee8');
    T((i+1)+'. '+s,px+16,y+29,{s:18,w:on?900:500,c:on?C.ink:'#b5aca3'})});
  // pressure bars
  const by=372; rr(px,by,388,146,14,'#fff');
  T('압력 비교 (차이를 크게 그림)',px+16,by+28,{s:15,c:C.gray,w:700});
  const base=56, dP=-flow*22; // lung pressure deviation (exaggerated)
  [['대기압',base,C.gray],['폐 속',base+dP,inh&&strong?C.teal:(!inh&&strong?C.coral:C.navy)]].forEach((b,i)=>{
    const x=px+70+i*130, y0=by+128; c.fillStyle=b[2];c.fillRect(x,y0-b[1],56,b[1]);T(b[0],x+28,y0+16,{a:'center',s:15,w:900})});
  c.setLineDash([6,5]);c.strokeStyle='#bdb6ae';c.lineWidth=2;c.beginPath();c.moveTo(px+60,by+128-base);c.lineTo(px+262,by+128-base);c.stroke();c.setLineDash([]);
  T('보일 법칙',px+285,by+70,{s:16,w:900,c:C.navy});T('PV = 일정',px+285,by+96,{s:17,w:900,c:C.coral});T('(온도 일정)',px+285,by+120,{s:13,c:C.gray,w:700});
}

requestAnimationFrame(frame);
</script>
 
</body></html>
