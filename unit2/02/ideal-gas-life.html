<!DOCTYPE html>
<html lang="ko"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이상 기체 법칙의 실생활 적용</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&amp;family=Noto+Sans+KR:wght@500;700;900&amp;display=swap" rel="stylesheet">
  <style>
html,body{margin:0;height:100%;background:#FFF9F0;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;cursor:pointer}
#hint{position:fixed;right:8px;bottom:6px;font:12px "Noto Sans KR",sans-serif;color:#9a8f86}
</style>
  <script src="https://cdn.tailwindcss.com/3.4.17" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js" type="text/javascript"></script>
  
  
  
 </head>
 <body data-template-id="__page-root">
  <canvas id="cv"></canvas>
  <div id="hint" data-template-id="hint" class="canva-text">
   화면을 누르면 멈춤/재생
  </div>
  <script>
const C={cream:'#FFF9F0',coral:'#E3614A',coralL:'#F8D3CA',teal:'#2BBFAE',tealD:'#1E8C80',ink:'#1D1F26',navy:'#35415A',gray:'#8C8C96',blue:'#3D7FD9',yellow:'#FFC94A',paper:'#FFFFFF'};
const HF='"Do Hyeon","Noto Sans KR",sans-serif', BF='"Noto Sans KR",sans-serif';
const cv=document.getElementById('cv'),c=cv.getContext('2d');let VW=800,VH=600,sc=1,ox=0,oy=0;
function fit(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;sc=Math.min(cv.width/VW,cv.height/VH);ox=(cv.width-VW*sc)/2;oy=(cv.height-VH*sc)/2}
addEventListener('resize',fit);fit();
let paused=false;cv.onclick=()=>{paused=!paused};
function T(s,x,y,o={}){c.font=(o.w||700)+' '+(o.s||24)+'px '+(o.f||BF);c.fillStyle=o.c||C.ink;c.textAlign=o.a||'left';c.textBaseline=o.b||'alphabetic';c.fillText(s,x,y)}
function H(s,x,y,o={}){T(s,x,y,Object.assign({f:HF,w:400},o))}
function rr(x,y,w,h,r,fill,stroke,lw){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||2;c.stroke()}}
function dot(x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,7);c.fill()}
function arrow(x1,y1,x2,y2,col,lw){c.strokeStyle=col;c.fillStyle=col;c.lineWidth=lw||4;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();const a=Math.atan2(y2-y1,x2-x1),L=lw*3.2+6;c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-L*Math.cos(a-0.45),y2-L*Math.sin(a-0.45));c.lineTo(x2-L*Math.cos(a+0.45),y2-L*Math.sin(a+0.45));c.fill()}
function flame(x,y,s,t){for(let k=0;k<3;k++){c.fillStyle=k?'#FFB13B':C.coral;const hh=s*(1.6-k*0.35)*(0.85+0.15*Math.sin(t*12+x+k));c.beginPath();c.moveTo(x-s*0.55*(1-k*0.25),y);c.quadraticCurveTo(x-s*0.5,y-hh*0.6,x,y-hh);c.quadraticCurveTo(x+s*0.5,y-hh*0.6,x+s*0.55*(1-k*0.25),y);c.fill()}}
function thermo(x,y,h,frac,label){rr(x-9,y,18,h,9,'#fff','#bdb6ae',2);dot(x,y+h+8,14,C.coral);c.fillStyle=C.coral;c.fillRect(x-4,y+h-(h-6)*Math.max(0,Math.min(1,frac)),8,(h-6)*Math.max(0,Math.min(1,frac))+8);if(label)T(label,x,y-10,{a:'center',s:20,c:C.ink})}
function speedCol(s){s=Math.max(0,Math.min(1,s));const a=[61,127,217],b=[227,97,74];return `rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*s)).join(',')})`}
let last=performance.now(),t=0;
function frame(now){const dt=Math.max(0,Math.min(0.05,(now-last)/1000));last=now;if(!paused)t+=dt;
 c.setTransform(1,0,0,1,0,0);c.fillStyle=C.cream;c.fillRect(0,0,cv.width,cv.height);c.setTransform(sc,0,0,sc,ox,oy);
 draw(paused?0:dt,t);if(paused){rr(VW-120,14,106,34,17,'rgba(29,31,38,.7)');T('⏸ 멈춤',VW-67,38,{a:'center',s:18,c:'#fff'})}
 requestAnimationFrame(frame)}

const BP=[];for(let i=0;i<30;i++){BP.push({r:Math.random(),a:Math.random()*6.28,ang:Math.random()*6.28})}
function draw(dt,t){
  H('생활 속 기체의 법칙',400,44,{a:'center',s:32});
  // ---- 열기구 (left)
  const cyc=(t%10)/10, burn=cyc<0.6, rise=Math.max(0,Math.sin(Math.min(1,cyc/0.6)*Math.PI/2));
  const bx=205, by=330-rise*60;
  rr(20,70,370,500,18,'#fff');
  H('열기구',205,108,{a:'center',s:28,c:C.coral});
  const R=78; c.fillStyle=C.coral;c.beginPath();c.ellipse(bx,by-40,R,R*1.12,0,0,7);c.fill();
  c.fillStyle='#f5b24a';c.beginPath();c.ellipse(bx,by-40,R*0.45,R*1.12,0,0,7);c.fill();
  // particles inside (fewer, faster when hot)
  const n=burn?14:24; for(let i=0;i<n;i++){const p=BP[i];p.ang+=dt*(burn?3:1.2)*(0.5+p.r);const rr2=R*0.75*Math.sqrt(p.r);dot(bx+Math.cos(p.ang+p.a)*rr2,by-40+Math.sin(p.ang*1.3+p.a)*rr2*1.1,5,burn?C.coral:C.blue)}
  c.strokeStyle='#7a6a58';c.lineWidth=2;c.beginPath();c.moveTo(bx-50,by+45);c.lineTo(bx-28,by+92);c.moveTo(bx+50,by+45);c.lineTo(bx+28,by+92);c.stroke();
  rr(bx-30,by+92,60,34,4,'#9b7a55'); if(burn)flame(bx,by+86,14,t);
  rr(40,470,330,80,14,C.coralL);T('가열 → 온도 ↑ → 부피 ↑',205,503,{a:'center',s:20,w:900,c:C.ink});T('→ 밀도 ↓ → 떠오름',205,535,{a:'center',s:20,w:900,c:C.coral});
  // ---- 호흡 (right)
  rr(410,70,370,500,18,'#fff');
  H('호흡',595,108,{a:'center',s:28,c:C.tealD});
  const ph=(Math.sin(t*1.1)+1)/2; // 0 exhale-ish,1 inhale
  const inh=Math.cos(t*1.1)>0; // derivative sign -> inhaling when expanding
  const lw=62+ph*24, lh=95+ph*26, cx=595, cy=290;
  c.fillStyle='#f6a99b';[ -1,1].forEach(s=>{c.beginPath();c.ellipse(cx+s*(lw*0.62),cy,lw*0.55,lh,0,0,7);c.fill()});
  c.strokeStyle='#c96b5c';c.lineWidth=8;c.beginPath();c.moveTo(cx,182);c.lineTo(cx,cy-60);c.stroke();
  const dy=cy+lh+12+ph*16; c.strokeStyle=C.navy;c.lineWidth=7;c.beginPath();c.moveTo(cx-130,dy-24+ph*14);c.quadraticCurveTo(cx,dy-40+ph*30,cx+130,dy-24+ph*14);c.stroke();
  T('가로막',cx+140,dy-14,{s:15,c:C.navy,w:700});
  if(inh){arrow(cx,130,cx,178,C.teal,5);}else{arrow(cx,178,cx,130,C.coral,5);}
  rr(430,470,330,80,14,inh?'#d5f2ee':C.coralL);
  if(inh){T('들숨: 가로막 ↓ → 폐 부피 ↑',595,503,{a:'center',s:19,w:900});T('→ 폐 속 압력 ↓ → 공기 들어옴',595,535,{a:'center',s:19,w:900,c:C.tealD})}
  else{T('날숨: 가로막 ↑ → 폐 부피 ↓',595,503,{a:'center',s:19,w:900});T('→ 폐 속 압력 ↑ → 공기 나감',595,535,{a:'center',s:19,w:900,c:C.coral})}
}
requestAnimationFrame(frame);
</script>
 
</body></html>
