<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>플라스크 속 기체 가열</title>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#FFF9F0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;cursor:pointer}
</style></head><body><canvas id="cv"></canvas>
<script>
const VW=800,VH=600;
const cv=document.getElementById('cv');cv.width=VW*2;cv.height=VH*2;
const c=cv.getContext('2d');c.scale(2,2);
const C={bg:'#FFF9F0',coral:'#E3614A',navy:'#35415A',sky:'#3E8FC9',gold:'#F2A93B',gray:'#9AA3B2',light:'#F3E6D8',purple:'#7B5EA7',green:'#3A9D6B'};
const F="'Do Hyeon',sans-serif";
function txt(s,x,y,size,col,align){c.font=size+'px '+F;c.fillStyle=col||C.navy;c.textAlign=align||'center';c.textBaseline='middle';c.fillText(s,x,y);}
function rr(x,y,w,h,r,fill,stroke,lw){c.beginPath();c.roundRect(x,y,w,h,r);if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.lineWidth=lw||3;c.strokeStyle=stroke;c.stroke();}}
function arrow(x1,y1,x2,y2,col,lw){c.strokeStyle=col;c.fillStyle=col;c.lineWidth=lw||5;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();const a=Math.atan2(y2-y1,x2-x1),h=lw*3+6;c.beginPath();c.moveTo(x2+Math.cos(a)*4,y2+Math.sin(a)*4);c.lineTo(x2-h*Math.cos(a-0.45),y2-h*Math.sin(a-0.45));c.lineTo(x2-h*Math.cos(a+0.45),y2-h*Math.sin(a+0.45));c.closePath();c.fill();}
function flame(x,y,s,t){for(let i=0;i<3;i++){const fx=x+(i-1)*s*0.9,fh=s*(1.4+0.25*Math.sin(t*9+i*2));c.fillStyle=C.coral;c.beginPath();c.moveTo(fx-s*0.4,y);c.quadraticCurveTo(fx-s*0.45,y-fh*0.6,fx,y-fh);c.quadraticCurveTo(fx+s*0.45,y-fh*0.6,fx+s*0.4,y);c.fill();c.fillStyle=C.gold;c.beginPath();c.moveTo(fx-s*0.2,y);c.quadraticCurveTo(fx-s*0.2,y-fh*0.35,fx,y-fh*0.55);c.quadraticCurveTo(fx+s*0.2,y-fh*0.35,fx+s*0.2,y);c.fill();}}
let paused=false,t=0,last=performance.now();
cv.addEventListener('click',()=>{paused=!paused;});
function loop(now){let dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;if(!paused){t+=dt;}c.clearRect(0,0,VW,VH);c.fillStyle=C.bg;c.fillRect(0,0,VW,VH);draw(paused?0:dt);if(paused){rr(VW-120,12,108,34,17,'rgba(53,65,90,0.85)');txt('일시 정지',VW-66,30,20,'#fff');}requestAnimationFrame(loop);}

const parts=[];for(let i=0;i<26;i++)parts.push({x:0,y:0,a:Math.random()*6.28,r:Math.random()});
const bubbles=[];let spawn=0;
function draw(dt){
  const cyc=12, ph=(t%cyc)/cyc;          // 0~0.5 손으로 감쌈(가열), 0.5~1 손 뗌
  const heat=ph<0.5? Math.min(1,ph/0.15) : Math.max(0,1-(ph-0.5)/0.15);
  const T=heat; // 0~1 상대 온도
  txt('플라스크 속 기체에 열을 가하면?',400,38,34,C.navy);
  // 비커
  const bx=470,by=330,bw=250,bh=200;
  rr(bx,by+60,bw,bh-60,8,'#CFE6F7');
  c.strokeStyle=C.navy;c.lineWidth=4;c.beginPath();c.moveTo(bx,by);c.lineTo(bx,by+bh);c.lineTo(bx+bw,by+bh);c.lineTo(bx+bw,by);c.stroke();
  txt('물',bx+bw-30,by+bh-25,22,C.sky);
  // 플라스크 (둥근바닥)
  const fx=200,fy=360,fr=110;
  c.fillStyle='rgba(255,255,255,0.7)';c.beginPath();c.arc(fx,fy,fr,0,6.283);c.fill();
  c.lineWidth=4;c.strokeStyle=C.navy;c.beginPath();c.arc(fx,fy,fr,-1.35,Math.PI+1.35,false);c.stroke();
  c.beginPath();c.moveTo(fx-24,fy-fr+3);c.lineTo(fx-24,fy-fr-50);c.moveTo(fx+24,fy-fr+3);c.lineTo(fx+24,fy-fr-50);c.stroke();
  rr(fx-32,fy-fr-78,64,32,6,'#B9805A');
  // 관
  c.lineWidth=10;c.strokeStyle='#8FA7BF';c.lineCap='round';c.beginPath();
  c.moveTo(fx,fy-fr-78);c.lineTo(fx,fy-fr-120);c.quadraticCurveTo(fx,fy-fr-150,fx+40,fy-fr-150);
  c.lineTo(bx+bw/2-30,fy-fr-150);c.quadraticCurveTo(bx+bw/2,fy-fr-150,bx+bw/2,fy-fr-120);c.lineTo(bx+bw/2,by+bh-30);c.stroke();c.lineCap='butt';
  const tipX=bx+bw/2,tipY=by+bh-30;
  // 공기 입자
  const sp=40+130*T;
  for(const p of parts){p.a+= (p.r-0.5)*0.6*dt*6;
    if(!p.x){p.x=fx+(Math.random()-0.5)*fr;p.y=fy+(Math.random()-0.5)*fr;}
    p.x+=Math.cos(p.a)*sp*dt;p.y+=Math.sin(p.a)*sp*dt;
    const dx=p.x-fx,dy=p.y-fy,d=Math.hypot(dx,dy);
    if(d>fr-10){const ang=Math.atan2(dy,dx);p.x=fx+Math.cos(ang)*(fr-11);p.y=fy+Math.sin(ang)*(fr-11);p.a=ang+Math.PI+(Math.random()-0.5);}
    c.fillStyle=T>0.5?C.coral:C.sky;c.beginPath();c.arc(p.x,p.y,7,0,6.283);c.fill();}
  // 손
  const handA=heat;
  if(handA>0.02){c.globalAlpha=handA;
    for(const s of [-1,1]){c.fillStyle='#F2C29B';c.beginPath();c.ellipse(fx+s*(fr+8),fy+10,30,fr*0.75,0,0,6.283);c.fill();
      c.strokeStyle='#C98F65';c.lineWidth=3;c.stroke();}
    for(let i=0;i<3;i++){arrow(fx-fr-60+i*0,fy-40+i*45,fx-fr-20,fy-40+i*45,C.coral,4);arrow(fx+fr+60,fy-40+i*45,fx+fr+20,fy-40+i*45,C.coral,4);}
    c.globalAlpha=1;}
  // 기포
  if(ph<0.5&&heat>0.5){spawn+=dt;if(spawn>0.45){spawn=0;bubbles.push({x:tipX,y:tipY,r:6+Math.random()*5,v:60+Math.random()*30});}}
  for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];b.y-=b.v*dt;b.x+=Math.sin(b.y/12)*0.6;
    if(b.y<by+65){bubbles.splice(i,1);continue;}
    c.strokeStyle=C.navy;c.lineWidth=2;c.fillStyle='rgba(255,255,255,0.8)';c.beginPath();c.arc(b.x,b.y,b.r,0,6.283);c.fill();c.stroke();}
  // 설명
  rr(30,540,740,46,12,'#fff',C.light,2);
  if(heat>0.5){txt('공기 온도 ↑ → 부피 팽창 → 관 끝에서 공기 방울이 나온다',400,563,24,C.coral);}
  else{txt('손을 떼면 공기 방울이 더 이상 나오지 않는다',400,563,24,C.navy);}
  txt(heat>0.5?'두 손으로 감싸 쥠':'손을 뗌',fx,505,24,heat>0.5?C.coral:C.gray);
}

document.fonts&&document.fonts.load("20px 'Do Hyeon'").finally(()=>requestAnimationFrame(loop));
if(!document.fonts)requestAnimationFrame(loop);
</script></body></html>
