<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>스털링 기관 단계별 보기</title>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#FFF9F0;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}</style>
</head><body><canvas id="cv"></canvas>
<script>
const VW=800,VH=600;const cv=document.getElementById('cv');cv.width=VW*2;cv.height=VH*2;const c=cv.getContext('2d');c.scale(2,2);
const CR='#E3614A',NV='#35415A',BG='#FFF9F0',TX='#1F1F1F',HOT='#E3614A',COLD='#4A7BD0',GOLD='#F2A93B',GRAY='#8A7F75';
const F=(s)=>s+"px 'Do Hyeon', 'Malgun Gothic', sans-serif";
function txt(s,x,y,size,col,al){c.font=F(size);c.fillStyle=col||TX;c.textAlign=al||'center';c.textBaseline='middle';c.fillText(s,x,y)}
function stxt(parts,x,y,size,col,al){c.font=F(size);let w=0;for(const[p,m]of parts){c.font=F(m=='s'?size*0.65:size);w+=c.measureText(p).width}let sx=al=='left'?x:al=='right'?x-w:x-w/2;c.fillStyle=col||TX;c.textAlign='left';c.textBaseline='middle';for(const[p,m]of parts){c.font=F(m=='s'?size*0.65:size);c.fillText(p,sx,m=='s'?y+size*0.28:y);sx+=c.measureText(p).width}}
function rr(x,y,w,h,r,fill,stroke,lw){c.beginPath();c.roundRect(x,y,w,h,r);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||2;c.stroke()}}
function arrow(x1,y1,x2,y2,w,col){const a=Math.atan2(y2-y1,x2-x1),h=Math.max(w*1.8,14);c.strokeStyle=col;c.fillStyle=col;c.lineWidth=w;c.lineCap='butt';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2-Math.cos(a)*h*0.9,y2-Math.sin(a)*h*0.9);c.stroke();c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-Math.cos(a)*h-Math.sin(a)*h*0.6,y2-Math.sin(a)*h+Math.cos(a)*h*0.6);c.lineTo(x2-Math.cos(a)*h+Math.sin(a)*h*0.6,y2-Math.sin(a)*h-Math.cos(a)*h*0.6);c.closePath();c.fill()}

/* ---------- 물리 상태 ---------- */
const T1=3,T2=1.5,V1=1,V2=3;
const HOTc=[227,97,74],COLDc=[74,123,208],GAS_HOT=[248,211,202],GAS_COLD=[207,224,245];
const ease=x=>x<=0?0:(x>=1?1:0.5-0.5*Math.cos(Math.PI*x));
const mix=(a,b,k)=>a.map((v,i)=>Math.round(v+(b[i]-v)*k));
const rgb=(q,a)=>a===undefined?'rgb('+q.join(',')+')':'rgba('+q.join(',')+','+a+')';
function stateAt(t){
 const base=Math.floor(t),s=((base%4)+4)%4,f=ease(t-base);let d,p,Tn;
 if(s===0){d=1;p=f;Tn=1}            // ①→② 등온 팽창
 else if(s===1){d=1-f;p=1;Tn=1-f}   // ②→③ 부피 일정, 냉각
 else if(s===2){d=0;p=1-f;Tn=0}     // ③→④ 등온 압축
 else{d=f;p=0;Tn=f}                 // ④→① 부피 일정, 가열
 const V=V1+(V2-V1)*p,T=T2+(T1-T2)*Tn;return{s,d,p,Tn,V,T,P:T/V};
}
const STEPS=[
 {chip:'①→② 등온 팽창',col:HOT,title:'① → ② 등온 팽창',
  l1:'피스톤이 위에 있어 기체는 아래쪽 고온부에 머문다.',l2:'기체가 열을 흡수하며 팽창해 동력 피스톤을 밀어 올린다.',
  rows:[['흡수 (+)',HOT],['외부에 일을 함 (+)',HOT],['0 (온도 일정)',NV]],eq:'Q = W'},
 {chip:'②→③ 등적 냉각',col:NV,title:'② → ③ 등적 과정 (냉각)',
  l1:'피스톤이 내려가며 기체를 위쪽 저온부로 옮긴다.',l2:'기체가 열을 방출해 온도와 압력이 낮아진다.',
  rows:[['방출 (−)',COLD],['0 (부피 일정)',NV],['감소 (−)',COLD]],eq:'Q = ΔU'},
 {chip:'③→④ 등온 압축',col:COLD,title:'③ → ④ 등온 압축',
  l1:'휠의 관성으로 동력 피스톤이 내려가 기체를 압축한다.',l2:'기체가 저온부로 열을 방출해 온도가 일정하게 유지된다.',
  rows:[['방출 (−)',COLD],['일을 받음 (−)',COLD],['0 (온도 일정)',NV]],eq:'Q = W'},
 {chip:'④→① 등적 가열',col:NV,title:'④ → ① 등적 과정 (가열)',
  l1:'피스톤이 올라가며 기체를 아래쪽 고온부로 옮긴다.',l2:'기체가 열을 흡수해 온도와 압력이 높아져 ①로 돌아온다.',
  rows:[['흡수 (+)',HOT],['0 (부피 일정)',NV],['증가 (+)',HOT]],eq:'Q = ΔU'}];
const INTRO={title:'① 상태에서 출발',l1:'기체의 부피가 작고, 고온부에 있어 온도와 압력이 높다.',l2:'‘다음 ▶’을 누르거나 위의 단계를 눌러 따라가 보자.'};

/* ---------- 진행 제어 ---------- */
let t=0,target=null,playing=false,speed=1,cycles=0;const SEG_DUR=3.2;
const moving=()=>playing||target!==null;
function infoSeg(){if(moving())return Math.floor(t)%4;const k=Math.round(t);return k===0?-1:(k-1)%4}
function goStep(i){playing=false;t=i;target=i+1}
function next(){playing=false;if(target!==null){t=target;if(t>=4)cycles++;target=null}let k=Math.round(t);if(k>=4)k=0;t=k;target=k+1}
function prev(){playing=false;target=null;t=Math.max(0,Math.round(t)-1)}
function reset(){playing=false;target=null;t=0;cycles=0}
function togglePlay(){if(playing){playing=false;const k=Math.ceil(t-1e-9);if(k>t)target=k}else{playing=true;target=null;if(t>=4)t=0}}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){next();e.preventDefault()}else if(e.key==='ArrowLeft'){prev();e.preventDefault()}else if(e.key===' '){togglePlay();e.preventDefault()}});
let hits=[];
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect(),s=Math.min(r.width/VW,r.height/VH);
 const x=(e.clientX-r.left-(r.width-VW*s)/2)/s,y=(e.clientY-r.top-(r.height-VH*s)/2)/s;
 for(const h of hits)if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){h.act();break}});
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect(),s=Math.min(r.width/VW,r.height/VH);
 const x=(e.clientX-r.left-(r.width-VW*s)/2)/s,y=(e.clientY-r.top-(r.height-VH*s)/2)/s;
 cv.style.cursor=hits.some(h=>x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h)?'pointer':'default'});

/* ---------- 기관 (내부 좌표 600×440) ---------- */
const G={cx0:110,cx1:390,cy0:210,cy1:340,px0:300,px1:360,pyTop:100};
const dTop=d=>302-84*d, pBot=p=>192-60*p;
const R=3.2,parts=[];
function inside(x,y,st){const dt=dTop(st.d),pb=pBot(st.p);
 const inCh=x>G.cx0+R&&x<G.cx1-R&&y>G.cy0+R&&y<G.cy1-R;
 const inDisp=x>122-R&&x<378+R&&y>dt-R&&y<dt+30+R;
 const inPw=x>G.px0+R&&x<G.px1-R&&y>pb+R&&y<G.cy0+R+2;
 return(inCh&&!inDisp)||inPw}
function respawn(q,st){const pb=pBot(st.p);for(let n=0;n<80;n++){const x=G.cx0+Math.random()*(G.cx1-G.cx0),y=pb+Math.random()*(G.cy1-pb);if(inside(x,y,st)){q.x=x;q.y=y;return}}}
{const st=stateAt(0);for(let i=0;i<52;i++){const a=Math.random()*6.28,q={x:0,y:0,vx:Math.cos(a),vy:Math.sin(a)};respawn(q,st);parts.push(q)}}
function moveParts(st,dt){const v=28+85*st.Tn;for(const q of parts){if(!inside(q.x,q.y,st))respawn(q,st);
 const nx=q.x+q.vx*v*dt,ny=q.y+q.vy*v*dt;
 if(inside(nx,ny,st)){q.x=nx;q.y=ny}else if(inside(q.x-q.vx*v*dt,ny,st))q.vx=-q.vx;else if(inside(nx,q.y-q.vy*v*dt,st))q.vy=-q.vy;else{q.vx=-q.vx;q.vy=-q.vy}}}

function drawEngine(st,seg,now){
 c.save();c.translate(12,112);c.scale(0.64,0.64);
 const pulse=0.55+0.45*Math.sin(now/260),dT=dTop(st.d),pb=pBot(st.p);
 const heating=seg===0||seg===3,cooling=seg===1||seg===2;
 // 가열판, 냉각 핀
 if(heating){c.globalAlpha=0.25+0.25*pulse;rr(G.cx0-16,G.cy1+6,G.cx1-G.cx0+32,28,10,GOLD);c.globalAlpha=1}
 rr(G.cx0-10,G.cy1+12,G.cx1-G.cx0+20,16,5,HOT);
 c.fillStyle=COLD;for(let fx=118;fx<=284;fx+=14){if(Math.abs(fx+4-160)<10)continue;c.fillRect(fx,G.cy0-24,8,14)}
 // 실린더
 c.fillStyle='#C9C2BA';c.fillRect(G.cx0-12,G.cy0-12,G.cx1-G.cx0+24,G.cy1-G.cy0+24);c.fillRect(G.px0-10,G.pyTop,G.px1-G.px0+20,G.cy0-G.pyTop);
 c.fillStyle=BG;c.fillRect(G.px0,G.pyTop,G.px1-G.px0,G.cy0-G.pyTop+1);
 const gas=rgb(mix(GAS_COLD,GAS_HOT,st.Tn));c.fillStyle=gas;c.fillRect(G.cx0,G.cy0,G.cx1-G.cx0,G.cy1-G.cy0);c.fillRect(G.px0,pb,G.px1-G.px0,G.cy0-pb+1);
 c.fillStyle=rgb(mix(COLDc,HOTc,st.Tn));for(const q of parts){c.beginPath();c.arc(q.x,q.y,R,0,6.28);c.fill()}
 // 피스톤
 rr(122,dT,256,30,6,'#7C8595',NV,2.5);c.strokeStyle='#5A6170';c.lineWidth=2;c.beginPath();c.moveTo(124,dT+15);c.lineTo(376,dT+15);c.stroke();
 txt('피스톤',270,dT+15,24,'#fff');
 // 막대·크랭크축
 const a=t*Math.PI/2,jD=56+12*(1-2*st.d),jP=56+12*(1-2*st.p),rTD=dT-140,rTP=pb-50;
 c.strokeStyle='#A9A29A';c.lineWidth=7;c.lineCap='butt';
 c.beginPath();c.moveTo(160,dT);c.lineTo(160,rTD);c.stroke();c.beginPath();c.moveTo(330,pb-20);c.lineTo(330,rTP);c.stroke();
 c.strokeStyle=NV;c.lineWidth=4;c.beginPath();c.moveTo(160,rTD);c.lineTo(160,jD);c.stroke();c.beginPath();c.moveTo(330,rTP);c.lineTo(330,jP);c.stroke();
 c.lineWidth=6;c.lineJoin='round';c.beginPath();c.moveTo(96,56);c.lineTo(140,56);c.lineTo(140,jD);c.lineTo(180,jD);c.lineTo(180,56);
 c.lineTo(310,56);c.lineTo(310,jP);c.lineTo(350,jP);c.lineTo(350,56);c.lineTo(520,56);c.stroke();
 for(const[x,y]of[[160,jD],[160,rTD],[330,jP],[330,rTP]]){c.beginPath();c.arc(x,y,6,0,6.28);c.fillStyle='#fff';c.fill();c.strokeStyle=NV;c.lineWidth=3;c.stroke()}
 c.fillStyle='#A9A29A';c.fillRect(90,44,10,24);
 // 동력 피스톤
 rr(G.px0+1,pb-22,G.px1-G.px0-2,22,4,NV);
 txt('동력 피스톤',G.px1+16,pb-11,24,NV,'left');
 // 휠
 const wx=520,wy=56,wr=46;
 c.beginPath();c.arc(wx,wy,wr,0,6.28);c.strokeStyle='#E4DCD2';c.lineWidth=12;c.stroke();
 c.strokeStyle='#B9AEA3';c.lineWidth=2.5;c.beginPath();c.arc(wx,wy,wr+6,0,6.28);c.stroke();c.beginPath();c.arc(wx,wy,wr-6,0,6.28);c.stroke();
 c.strokeStyle=NV;c.lineWidth=3.5;for(let k=0;k<6;k++){const aa=a+k*Math.PI/3;c.beginPath();c.moveTo(wx+9*Math.cos(aa),wy+9*Math.sin(aa));c.lineTo(wx+(wr-6)*Math.cos(aa),wy+(wr-6)*Math.sin(aa));c.stroke()}
 c.beginPath();c.arc(wx,wy,10,0,6.28);c.fillStyle=NV;c.fill();
 c.beginPath();c.arc(wx+(wr-14)*Math.cos(a),wy+(wr-14)*Math.sin(a),6,0,6.28);c.fillStyle=CR;c.fill();
 c.strokeStyle=GRAY;c.lineWidth=3;c.beginPath();c.arc(wx,wy,wr+18,-0.2,0.8);c.stroke();
 {const ea=0.8,ax=wx+(wr+18)*Math.cos(ea),ay=wy+(wr+18)*Math.sin(ea),tg=ea+Math.PI/2;c.fillStyle=GRAY;c.beginPath();c.moveTo(ax+11*Math.cos(tg),ay+11*Math.sin(tg));c.lineTo(ax+7*Math.cos(ea),ay+7*Math.sin(ea));c.lineTo(ax-7*Math.cos(ea),ay-7*Math.sin(ea));c.closePath();c.fill()}
 txt('휠',wx-74,wy-30,26,NV);
 // 영역 이름
 txt('저온부',14,G.cy0-8,28,COLD,'left');stxt([['(T','n'],['2','s'],[')','n']],14,G.cy0+22,24,COLD,'left');
 txt('고온부',14,G.cy1+14,28,HOT,'left');stxt([['(T','n'],['1','s'],[')','n']],14,G.cy1+44,24,HOT,'left');
 // 열 화살표
 c.globalAlpha=0.55+0.45*pulse;
 if(heating){for(const x of[180,250,320])arrow(x,G.cy1+95,x,G.cy1+38,8,HOT);c.globalAlpha=1;txt('열 흡수',14,G.cy1+82,28,HOT,'left')}
 if(cooling){for(const x of[128,206,262])arrow(x,G.cy0-28,x,G.cy0-80,8,COLD);c.globalAlpha=1;txt('열 방출',14,G.cy0-60,28,COLD,'left')}
 c.globalAlpha=1;c.restore();
}

/* ---------- P-V 그래프 (내부 좌표 520×440) ---------- */
const OX=64,OY=392,GW=430,GH=350,VMAX=3.6,PMAX=3.4;
const xV=V=>OX+V/VMAX*GW,yP=P=>OY-P/PMAX*GH;
function drawPV(st,seg,now){
 c.save();c.translate(418,104);c.scale(0.68,0.68);
 const pulse=0.55+0.45*Math.sin(now/260);
 // 넓이
 c.beginPath();for(let i=0;i<=40;i++){const V=V1+(V2-V1)*i/40;i?c.lineTo(xV(V),yP(T1/V)):c.moveTo(xV(V),yP(T1/V))}
 for(let j=0;j<=40;j++){const V=V2-(V2-V1)*j/40;c.lineTo(xV(V),yP(T2/V))}c.closePath();c.fillStyle='rgba(242,169,59,0.22)';c.fill();
 // 축
 arrow(OX,OY,OX,OY-GH-24,3,TX);arrow(OX,OY,OX+GW+20,OY,3,TX);
 txt('압력',OX-34,OY-GH-14,28,TX);txt('부피',OX+GW+14,OY+32,28,TX);txt('0',OX-18,OY+18,24,TX);
 c.setLineDash([5,6]);c.strokeStyle='#B9AEA3';c.lineWidth=2;
 for(const V of[V1,V2]){c.beginPath();c.moveTo(xV(V),OY);c.lineTo(xV(V),yP(T1/V));c.stroke()}
 // 등온선
 for(const[T,col]of[[T1,HOT],[T2,COLD]]){c.strokeStyle=col;c.beginPath();for(let i=0;i<=60;i++){const V=0.92+(3.45-0.92)*i/60;i?c.lineTo(xV(V),yP(T/V)):c.moveTo(xV(V),yP(T/V))}c.stroke()}
 c.setLineDash([]);
 stxt([['V','n'],['1','s']],xV(V1),OY+22,26,GRAY);stxt([['V','n'],['2','s']],xV(V2),OY+22,26,GRAY);
 stxt([['T','n'],['1','s']],xV(3.45)+8,yP(T1/3.45)-4,28,HOT,'left');stxt([['T','n'],['2','s']],xV(3.45)+8,yP(T2/3.45),28,COLD,'left');
 txt('W',xV(1.95),yP(1.2),44,'#C07A12');
 txt('색칠한 넓이 = 한 순환 동안 한 일',xV(2.45),yP(3.25),22,GRAY);
 // 경로
 c.lineCap='round';
 const seg4=(t0,t1,w,colf)=>{let pr=stateAt(t0);for(let tt=t0+0.02;tt<=t1+1e-9;tt+=0.02){const s=stateAt(Math.min(tt,t1));c.strokeStyle=colf((pr.Tn+s.Tn)/2);c.lineWidth=w;c.beginPath();c.moveTo(xV(pr.V),yP(pr.P));c.lineTo(xV(s.V),yP(s.P));c.stroke();pr=s}};
 seg4(0,4,4,()=>'#B9AEA3');
 if(t>0)seg4(0,t,8,k=>rgb(mix(COLDc,HOTc,k)));
 // 방향 화살촉
 for(const m of[0.5,1.5,2.5,3.5]){if(t<m+0.05&&cycles===0)continue;const A=stateAt(m-0.03),B=stateAt(m+0.03);const an=Math.atan2(yP(B.P)-yP(A.P),xV(B.V)-xV(A.V)),X=xV(B.V),Y=yP(B.P);
  c.fillStyle=rgb(mix(COLDc,HOTc,B.Tn));c.beginPath();c.moveTo(X+13*Math.cos(an),Y+13*Math.sin(an));c.lineTo(X-10*Math.cos(an-0.6),Y-10*Math.sin(an-0.6));c.lineTo(X-10*Math.cos(an+0.6),Y-10*Math.sin(an+0.6));c.closePath();c.fill()}
 // 상태 번호
 for(const[V,P,l,dx,dy]of[[V1,T1/V1,'①',-26,-16],[V2,T1/V2,'②',24,-18],[V2,T2/V2,'③',24,20],[V1,T2/V1,'④',-26,18]]){
  c.beginPath();c.arc(xV(V),yP(P),6,0,6.28);c.fillStyle=TX;c.fill();txt(l,xV(V)+dx,yP(P)+dy,32,TX)}
 // 열 화살표
 c.globalAlpha=0.55+0.45*pulse;
 if(seg===0){const X=xV(1.8),Y=yP(T1/1.8);arrow(X+40,Y-70,X+6,Y-12,7,HOT);c.globalAlpha=1;txt('열 흡수',X+48,Y-86,28,HOT,'left')}
 if(seg===1){const X=xV(V2),Y=yP(0.72);arrow(X+8,Y,X+60,Y,7,COLD);c.globalAlpha=1;txt('열 방출',X-12,Y,28,COLD,'right')}
 if(seg===2){const X=xV(1.8),Y=yP(T2/1.8);arrow(X-4,Y+12,X-40,Y+64,7,COLD);c.globalAlpha=1;txt('열 방출',X-20,Y+84,28,COLD,'left')}
 if(seg===3){const X=xV(V1),Y=yP(2.25);arrow(X-66,Y,X-8,Y,7,HOT);c.globalAlpha=1;txt('열 흡수',X-12,Y-28,28,HOT,'right')}
 c.globalAlpha=1;
 // 현재 상태
 c.beginPath();c.arc(xV(st.V),yP(st.P),15,0,6.28);c.fillStyle=rgb(mix(COLDc,HOTc,st.Tn));c.fill();c.strokeStyle='#fff';c.lineWidth=4;c.stroke();
 c.restore();
}

/* ---------- 화면 구성 ---------- */
function button(x,y,w,h,label,act,style){
 if(style==='main')rr(x,y,w,h,h/2,NV);else if(style==='on')rr(x,y,w,h,h/2,'#F8D3CA');else rr(x,y,w,h,h/2,'#fff','#EADFD2',2);
 txt(label,x+w/2,y+h/2+1,19,style==='main'?'#fff':NV);hits.push({x,y,w,h,act});
}
function drawUI(seg,now){
 hits=[];
 txt('스털링 기관 단계별 보기',VW/2,32,32,TX);
 // 단계 칩
 for(let i=0;i<4;i++){const x=24+i*190,on=i===seg;rr(x,56,180,40,20,on?STEPS[i].col:'#EFE6DA');txt(STEPS[i].chip,x+90,77,19,on?'#fff':GRAY);hits.push({x,y:56,w:180,h:40,act:()=>goStep(i)})}
 // 설명 판

let last=performance.now();
function loop(now){

 if(playing){t+=dt*speed/SEG_DUR;if(t>=4){t-=4;cycles++}}
 else if(target!==null){t+=dt*speed/SEG_DUR;if(t>=target){t=target;target=null;if(t>=4)cycles++}}
 const st=stateAt(t),seg=infoSeg();
 moveParts(st,dt);
 c.fillStyle=BG;c.fillRect(0,0,VW,VH);

 requestAnimationFrame(loop);
}
