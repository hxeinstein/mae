const SX=338.4,SY=142.6,SW=210,SH=294,CX=441.4,TOPC=89.3,CW=9.5;
const T=1.3,w=2*Math.PI/T,GAMMA=0.06,MAXD=42,MIND=-40;
let d=0,A=0,t=0,dragging=false,grab=0,last=null;
function pos(e){const r=cv.getBoundingClientRect(),s=Math.min(r.width/VW,r.height/VH),ox=(r.width-VW*s)/2,oy=(r.height-VH*s)/2;return{x:(e.clientX-r.left-ox)/s,y:(e.clientY-r.top-oy)/s}}
cv.addEventListener('pointerdown',e=>{const p=pos(e);if(p.x>SX&&p.x<SX+SW&&p.y>SY+d&&p.y<SY+d+SH){dragging=true;grab=p.y-d;cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';}});
cv.addEventListener('pointermove',e=>{const p=pos(e);if(dragging){d=Math.max(MIND,Math.min(MAXD,p.y-grab));}else{cv.style.cursor=(p.x>SX&&p.x<SX+SW&&p.y>SY+d&&p.y<SY+d+SH)?'grab':'default';}});
function release(){if(!dragging)return;dragging=false;A=d;t=0;cv.style.cursor='grab';}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);
function coil(y1,y2){const n=9,L=y2-y1,step=L/n;c.lineWidth=2.6;c.strokeStyle='#6f9fd8';
 for(let i=0;i<n;i++){const y=y1+step*(i+0.5);c.beginPath();c.ellipse(CX,y,CW,Math.max(1.2,step*0.42),0,0,Math.PI*2);c.stroke();}
 c.strokeStyle='#4f7fc0';c.lineWidth=2.6;c.beginPath();c.moveTo(CX,y1);c.lineTo(CX,y1+2);c.moveTo(CX,y2-2);c.lineTo(CX,y2);c.stroke();}
function draw(){c.fillStyle='#fff';c.fillRect(0,0,VW,VH);if(base.complete)c.drawImage(base,0,0,VW,VH);
 coil(TOPC,SY+d+1);if(sp.complete)c.drawImage(sp,SX,SY+d,SW,SH);
 c.fillStyle='#8c8c96';c.font="15px 'Malgun Gothic',sans-serif";c.textAlign='right';c.fillText(dragging?'놓으면 튕겨요':'아기를 끌어 내렸다 놓아 보세요',VW-8,VH-8);}
function loop(ts){if(last===null)last=ts;const dt=Math.min(0.05,Math.max(0,(ts-last)/1000));last=ts;
